<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Ryuk® Design Studio</title>
    <link rel="stylesheet" href="style.css?v=54" />
    <style>
      .offline-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 24px;
        background: #080808;
      }
      .offline-title {
        font-family: var(--font-title);
        font-size: clamp(2rem, 4vw, 3.5rem);
        color: var(--text);
        margin-bottom: 16px;
      }
      .offline-desc {
        color: var(--text-dim);
        font-size: 1rem;
        max-width: 440px;
        margin-bottom: 32px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="offline-wrapper">
      <h1 class="offline-title">You are currently offline</h1>
      <p class="offline-desc font-inter">
        Please check your internet connection. Cached pages are available, or click below to retry.
      </p>
      <button onclick="window.location.reload()" class="error-btn" style="background: var(--text); color: var(--bg); border: none; padding: 14px 28px; border-radius: 100px; cursor: pointer; font-family: var(--font-mono); text-transform: uppercase;">
        Retry Connection ↺
      </button>
    </div>
  </body>
</html>
